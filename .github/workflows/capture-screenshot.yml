name: Capture Android screenshot

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "scripts/make_social_preview.py"
      - ".github/workflows/capture-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture home screen
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p screenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put system font_scale 1.0
            adb shell am force-stop com.bridgesdigital.hearandseek
            adb shell am start -W -n com.bridgesdigital.hearandseek/.MainActivity
            sleep 5
            adb exec-out screencap -p > screenshots/hear-and-seek-home.png

      - name: Build social images
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/make_social_preview.py screenshots/hear-and-seek-home.png

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: hear-and-seek-images
          path: docs/images/*.png
          if-no-files-found: error
          retention-days: 14
